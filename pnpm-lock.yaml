lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    dependencies:
      '@openclime/plugin-manifest':
        specifier: file:./vendor/plugin-manifest
        version: file:vendor/plugin-manifest
      '@openclime/plugin-pack':
        specifier: file:./vendor/plugin-pack
        version: file:vendor/plugin-pack
      fflate:
        specifier: ^0.8.2
        version: 0.8.3
      zod:
        specifier: ^4.4.3
        version: 4.4.3

packages:

  '@openclime/plugin-manifest@file:vendor/plugin-manifest':
    resolution: {directory: vendor/plugin-manifest, type: directory}

  '@openclime/plugin-pack@file:vendor/plugin-pack':
    resolution: {directory: vendor/plugin-pack, type: directory}
    engines: {node: '>=20.0.0'}
    hasBin: true

  fflate@0.8.3:
    resolution: {integrity: sha512-tbZNuJrLwGUp3zshBtdy4W+ORxZuIh8a5ilyIEQDC5rY1f3U20JMry0Ll3WBzU58EZKsEuJFXhb5gwv8CsPvgA==}

  zod@4.4.3:
    resolution: {integrity: sha512-ytENFjIJFl2UwYglde2jchW2Hwm4GJFLDiSXWdTrJQBIN9Fcyp7n4DhxJEiWNAJMV1/BqWfW/kkg71UDcHJyTQ==}

snapshots:

  '@openclime/plugin-manifest@file:vendor/plugin-manifest':
    dependencies:
      zod: 4.4.3

  '@openclime/plugin-pack@file:vendor/plugin-pack':
    dependencies:
      '@openclime/plugin-manifest': file:vendor/plugin-manifest
      fflate: 0.8.3

  fflate@0.8.3: {}

  zod@4.4.3: {}
